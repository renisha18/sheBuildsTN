name: Check contributions

# Runs on every pull request, so a bad event file is caught before a person reviews it.
# It uses no secrets, so it is safe for pull requests from forks.
on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate event files
        run: npm run validate:events
      - name: Build the site
        run: npm run build
